# nelisp-ime key remapping. Edit here or in the editor window.
# UTF-8. yes/no; layout: os | US | JIS. Missing file means disabled.
# Keys: CapsLock, LCtrl, RCtrl, LAlt, Shift, A, F1, sc:0x3A, sc:e0:0x1D, vk:0x19.
# Targets: a key, chord, ime-toggle, ime-on, ime-off, or none.
# One rule per line. # starts a comment. Invalid lines are preserved/reported.
# Hook codes are AFTER Windows Scancode Map (CapsLock may already be LCtrl).
enabled = no
layout = os
pass-injected = yes

[keys]
# CapsLock = LCtrl

[shortcuts]
# LAlt+Space = ime-toggle
# Ctrl+Space = LWin+Space

[exclude]
# mstsc.exe
