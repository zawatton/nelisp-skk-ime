# nelisp-ime input rules for hiragana and katakana. UTF-8.
# Edit this file or use nelisp-ime-keymap --rules. Invalid lines are skipped.
# Quoted strings preserve spaces; escape a quote or backslash with backslash.
width = hankaku # hankaku | zenkaku
auto-pair = yes # yes | no
[symbols-hankaku]
! = "!"
, = ", "
. = ". "
: = ":"
; = ";"
? = "?"
"z " = " "
[symbols-zenkaku]
! = "！"
, = "、"
. = "。"
: = "："
; = "；"
? = "？"
"z " = "　"
[pairs-hankaku]
( = "(" ")"
[ = "「" "」"
{ = "{" "}"
[pairs-zenkaku]
( = "(" ")"
[ = "「" "」"
{ = "｛" "｝"
[pairs]
「 = "「" "」"
『 = "『" "』"
( = "(" ")"
（ = "（" "）"
{ = "{" "}"
｛ = "｛" "｝"
〈 = "〈" "〉"
《 = "《" "》"
[ = "[" "]"
［ = "［" "］"
〔 = "〔" "〕"
【 = "【" "】"
"\"" = "\"" "\""
“ = "“" "”"
` = "`" "'"
